name: Discover Engine CI

on:
  push:
    branches: [main]
    paths:
      - "invention-service/**"
      - ".github/workflows/discover-engine-ci.yml"
  pull_request:
    paths:
      - "invention-service/**"
      - ".github/workflows/discover-engine-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invention-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit and regression tests
        run: npm test
      - name: Type-check service
        run: npx tsc --noEmit
