name: Discover Engine CI

on:
  push:
    branches: [main]
    paths:
      - "invention-service/**"
      - "daisy-app/**"
      - "daisy-engine/**"
      - "workspace.jsonc"
      - ".bitmap"
      - ".github/workflows/discover-engine-ci.yml"
  pull_request:
    paths:
      - "invention-service/**"
      - "daisy-app/**"
      - "daisy-engine/**"
      - "workspace.jsonc"
      - ".bitmap"
      - ".github/workflows/discover-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: discovery_test
          POSTGRES_USER: discovery
          POSTGRES_PASSWORD: ci-discovery-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discovery -d discovery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://discovery:ci-discovery-password@127.0.0.1:5432/discovery_test
      DISCOVERY_TENANT_ID: ci-tenant
      DISCOVERY_API_TOKEN: ci-discovery-token-for-local-pipeline-validation-2026
      DISCOVERY_ALLOW_LOCAL_TEST_DATABASE: 'true'
      NODE_ENV: test
    defaults:
      run:
        working-directory: invention-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --package-lock-only
          npm ci
      - name: Upload generated service lockfile
        uses: actions/upload-artifact@v4
        with:
          name: discover-engine-service-lockfile
          path: invention-service/package-lock.json
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          AUDIT_EXIT=$?
          set -e
          AUDIT_EXIT="$AUDIT_EXIT" node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log("Dependency audit:", JSON.stringify(counts));
            for (const [name, count] of Object.entries(counts)) console.log(`${name}: ${count}`);
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(entry => typeof entry === "string" ? entry : entry.name);
              console.log("PACKAGE", JSON.stringify({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via}));
            }
            console.log("Audit command exit:", process.env.AUDIT_EXIT);
          '
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-engine-dependency-audit
          path: /tmp/npm-audit.json
          if-no-files-found: warn
      - name: Apply tenant-isolated schema to disposable CI PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_create_daisy_projects.sql
      - name: Run unit and regression tests
        run: npm test
      - name: Type-check service
        run: npm run typecheck
      - name: Run live seven-stage invention pipeline
        shell: bash
        run: |
          set -euo pipefail
          export PORT=4173
          # Use an ephemeral CI-only credential; never reuse the Render production secret.
          export DISCOVERY_API_TOKEN="ci-discovery-token-for-local-pipeline-validation-2026"
          npm start > /tmp/discover-engine.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:$PORT/ >/tmp/health.json; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat /tmp/discover-engine.log
              exit 1
            fi
            sleep 2
          done
          jq -e '.status == "ok"' /tmp/health.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $DISCOVERY_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"query":"solid state battery","domains":["machine learning","bio-inspired"]}' \
            http://127.0.0.1:$PORT/projects > /tmp/project-start.json
          PROJECT_ID=$(jq -r '.id' /tmp/project-start.json)
          test -n "$PROJECT_ID" && test "$PROJECT_ID" != "null"
          echo "Started project: $PROJECT_ID"

          READY=0
          for attempt in $(seq 1 180); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $DISCOVERY_API_TOKEN" \
              "http://127.0.0.1:$PORT/projects/$PROJECT_ID" > /tmp/project.json
            STATUS=$(jq -r '.status' /tmp/project.json)
            echo "Pipeline status ($attempt): $STATUS"
            if [ "$STATUS" = "ready" ]; then READY=1; break; fi
            if [ "$STATUS" = "error" ]; then
              cat /tmp/project.json
              cat /tmp/discover-engine.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Pipeline timed out"
            cat /tmp/project.json
            cat /tmp/discover-engine.log
            exit 1
          fi

          jq -e '.evidenceClaims | type == "array"' /tmp/project.json
          jq -e '(.evidenceClaims // []) as $claims | [$claims[] | select(.reviewStatus == "human_review_required" or .reviewStatus == "insufficient_evidence" or .reviewStatus == "conflicting")] | length == ($claims | length)' /tmp/project.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $DISCOVERY_API_TOKEN" \
            "http://127.0.0.1:$PORT/projects/$PROJECT_ID/evaluation" > /tmp/evaluation.json
          jq -e '.rows | length > 0' /tmp/evaluation.json
          jq -e '.weights == {} and ([.rows[] | select(.isBaseline == false) | .evidenceStatus == "hypothesis_only" and .overall == null and .evidence == null] | all)' /tmp/evaluation.json

          curl --silent --output /tmp/simulation-response.json --write-out '%{http_code}' -X POST \
            -H "Authorization: Bearer $DISCOVERY_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"trials":500,"baselineNoise":3}' \
            "http://127.0.0.1:$PORT/projects/$PROJECT_ID/inventions/$(jq -r '.inventions[0].id' /tmp/project.json)/experiments" > /tmp/simulation-status.txt
          test "$(cat /tmp/simulation-status.txt)" = "410"
          jq -e '.message | contains("Simulation disabled")' /tmp/simulation-response.json

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $DISCOVERY_API_TOKEN" \
            "http://127.0.0.1:$PORT/projects/$PROJECT_ID/export" -o /tmp/discover-engine-export.zip
          unzip -t /tmp/discover-engine-export.zip
          unzip -Z1 /tmp/discover-engine-export.zip | grep -q 'evidence-claims.json'
          echo "LIVE PIPELINE PASSED: project=$PROJECT_ID"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daisy-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve and install pinned frontend dependencies
        run: |
          npm install --package-lock-only
          npm ci
      - name: Upload generated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: discover-engine-frontend-lockfile
          path: daisy-app/package-lock.json
      - name: Build Daisy frontend
        run: npm run build

  bit-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Bit
        run: npx --yes @teambit/bvm install
      - name: Add Bit to subsequent step PATH
        run: echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install Bit workspace dependencies
        run: bit install
      - name: Build all Bit components
        run: bit build

  sync-service-lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/neon-tenant-persistence-20261126'
    needs: [test, frontend, bit-workspace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate reproducible service lockfile
        working-directory: invention-service
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit generated lockfile only to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invention-service/package-lock.json
          if git diff --cached --quiet; then
            echo "Service lockfile already current."
            exit 0
          fi
          git commit -m "chore: sync discovery service package lockfile"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
